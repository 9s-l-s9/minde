# SPDX-License-Identifier: GPL-3.0-or-later
name: guix-binary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guix-binary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == '9s-l-s9/minde' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # All Node actions must use the filtered OpenSSL trust store too.
      NODE_OPTIONS: --use-openssl-ca --max-http-header-size=32768
    steps:
      # Runs before checkout, so even downloading the repository uses the
      # remediated CA bundle. No unverified remote installer is executed.
      - name: Exclude compromised certificate chains
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, re, ssl
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'minde-trust'
          root.mkdir(mode=0o700)
          (root / 'empty').mkdir()
          blocked = {
              # emSign ECC Root CA - G3, plus AAA Certificate Services
              # (cross-signed the same compromised eMudhra intermediates).
              '86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b',
              'd7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4',
          }
          source = pathlib.Path('/etc/ssl/certs/ca-certificates.crt').read_text()
          certs = re.findall(r'-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----', source, re.S)
          certs = [c for c in certs if hashlib.sha256(ssl.PEM_cert_to_DER_cert(c)).hexdigest() not in blocked]
          assert len(certs) > 50, 'unexpected/empty CA bundle'
          bundle = root / 'ca-certificates.crt'
          bundle.write_text('\n'.join(certs) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              for key in ('MINDE_CA_BUNDLE', 'SSL_CERT_FILE', 'CURL_CA_BUNDLE', 'GIT_SSL_CAINFO', 'CARGO_HTTP_CAINFO', 'REQUESTS_CA_BUNDLE'):
                  env.write(f'{key}={bundle}\n')
              env.write(f'SSL_CERT_DIR={root / "empty"}\n')
          print(f'TLS trust: {len(certs)} certificates; compromised trust paths excluded')
          PY

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      # GITHUB_TOKEN cannot create a tag for an old commit whose workflows
      # differ from main. Reserve it while this is the current main commit,
      # before compilation gives a later push time to change the workflow.
      - name: Reserve the build tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="guix-$GITHUB_SHA"
          if tagged=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
            test "$tagged" = "$GITHUB_SHA"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" >/dev/null
          fi

      - name: Install verified Guix bootstrap
        run: scripts/ci-bootstrap-guix

      - name: Build and test binary package
        run: scripts/ci-binary

      # Call the pinned components directly: the composite action overwrites
      # NODE_OPTIONS, which would undo our OpenSSL CA-store selection.
      - name: Generate provenance
        id: predicate
        uses: actions/attest-build-provenance/predicate@864457a58d4733d7f1574bd8821fa24e02cf7538 # predicate v2.0.0

      - name: Attest archive, metadata, and ephemeral signing key
        id: attest
        uses: actions/attest@daf44fb950173508f38bd2406030372c1d1162b1 # v3.0.0
        with:
          subject-path: build/ci/binary/*
          predicate-type: ${{ steps.predicate.outputs.predicate-type }}
          predicate: ${{ steps.predicate.outputs.predicate }}

      - name: Publish commit-specific download
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$ATTESTATION_BUNDLE" build/ci/binary/provenance.json
          gh release create "guix-$GITHUB_SHA" build/ci/binary/* \
            --verify-tag --prerelease \
            --title "Guix binary ${GITHUB_SHA:0:12}" \
            --notes "Verified Guix runtime closure for commit $GITHUB_SHA. Import with the System repository's scripts/minde-binary.scm."
