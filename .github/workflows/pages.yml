# SPDX-License-Identifier: GPL-3.0-or-later
#
# Publishes doc/ as a GitHub Pages site, built with Haunt (Guile Scheme)
# via doc/haunt.scm -- the same language Minde's own policy layer and
# doc generator scripts are written in, run through the same Guix
# environment mechanism as scripts/ci, just a smaller manifest
# (doc/manifest.scm) since this never needs the Rust/Smithay side.
#
# Requires the repository to be public, or a GitHub plan that supports
# Pages on private repositories -- Pages sites are published to the public
# internet regardless of source-repo visibility. Once that's true, enable
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions; this
# workflow then deploys on every push to main that touches doc/.

name: pages

on:
  push:
    branches: [main]
    paths:
      - 'doc/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Cache Guix store
        uses: actions/cache@v4
        with:
          path: |
            /gnu/store
            /var/guix
          key: guix-store-docs-${{ runner.os }}-${{ hashFiles('doc/manifest.scm') }}
          restore-keys: |
            guix-store-docs-${{ runner.os }}-

      - name: Install Guix
        uses: PromyLOPh/guix-install-action@v1

      - name: Build with Haunt
        working-directory: doc
        run: >-
          guix shell -m manifest.scm -- sh -c
          'GUILE_LOAD_PATH="$PWD/../tools/guile-autodoc:$GUILE_LOAD_PATH" haunt build'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
