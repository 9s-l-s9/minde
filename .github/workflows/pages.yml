# SPDX-License-Identifier: GPL-3.0-or-later
#
# Publishes the focused Minde landing page from site/, built with Haunt.
# Detailed documentation remains in doc/ and is linked from the landing page.
#
# Requires the repository to be public, or a GitHub plan that supports
# Pages on private repositories -- Pages sites are published to the public
# internet regardless of source-repo visibility. Once that's true, enable
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions; this
# workflow then deploys on every push to main that touches site/.

name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # No /gnu/store cache: confirmed non-functional in ci.yml (the daemon/
      # build-user-owned substitute cache can't be tar'd up by the
      # unprivileged runner account actions/cache saves as). pullAfterInstall
      # is the real lever -- see ci.yml's header comment for measurements.
      - name: Install Guix
        uses: PromyLOPh/guix-install-action@v1
        with:
          pullAfterInstall: false

      - name: Build with Haunt
        working-directory: site
        run: guix shell -m manifest.scm -- haunt build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
