# SPDX-License-Identifier: GPL-3.0-or-later
#
# Hosted CI. This workflow contains no gate logic: every check lives in
# scripts/ci, the same noninteractive entry point a developer runs locally
# (`scripts/ci`, `scripts/ci --ci-rust`, `scripts/ci --ci-scheme`). YAML here
# only checks out the code, installs Guix, caches Rust build artifacts,
# calls scripts/ci, and uploads artifacts. If a hosted run and a local run
# disagree, that is a bug in scripts/ci, not here.
#
# check-rust and check-scheme are scripts/ci --ci-rust / --ci-scheme (see its
# header comment) run as two parallel jobs instead of one serial `scripts/ci`:
# together they cover exactly the same gates, but check-rust's environment
# (manifest-check.scm: the Rust toolchain and Smithay's native deps) and
# check-scheme's (manifest-scheme.scm: just Guile and text-processing tools)
# no longer block on each other's Guix install, and check-scheme's usually-
# faster, more-actionable failures (Scheme suites, static analysis, doc
# drift) surface without waiting on `cargo check` to finish compiling
# Smithay.
#
# Guix bootstrap bytes and channel revisions are pinned. The TLS step runs
# before checkout and excludes the compromised eMudhra trust paths. See
# scripts/ci-bootstrap-guix and guix/ci-channels.scm.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-rust:
    runs-on: ubuntu-24.04
    env:
      NODE_OPTIONS: --use-openssl-ca
    steps:
      - name: Exclude compromised certificate chains
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, re, ssl
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'minde-trust'
          root.mkdir(mode=0o700)
          (root / 'empty').mkdir()
          blocked = {
              # emSign ECC Root CA - G3, plus AAA Certificate Services
              # (cross-signed the same compromised eMudhra intermediates).
              '86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b',
              'd7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4',
          }
          source = pathlib.Path('/etc/ssl/certs/ca-certificates.crt').read_text()
          certs = re.findall(r'-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----', source, re.S)
          certs = [c for c in certs if hashlib.sha256(ssl.PEM_cert_to_DER_cert(c)).hexdigest() not in blocked]
          assert len(certs) > 50, 'unexpected/empty CA bundle'
          bundle = root / 'ca-certificates.crt'
          bundle.write_text('\n'.join(certs) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              for key in ('MINDE_CA_BUNDLE', 'SSL_CERT_FILE', 'CURL_CA_BUNDLE', 'GIT_SSL_CAINFO', 'CARGO_HTTP_CAINFO', 'REQUESTS_CA_BUNDLE'):
                  env.write(f'{key}={bundle}\n')
              env.write(f'SSL_CERT_DIR={root / "empty"}\n')
          print(f'TLS trust: {len(certs)} certificates; compromised trust paths excluded')
          PY

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false

      # `cargo check` compiles the full dependency graph (Smithay and its
      # transitive deps) from network-fetched sources -- not the vendored
      # crate mirror, which is only materialized for --release-artifacts.
      # Without this, every run recompiles all of it from scratch.
      #
      # Cache build-script executables only across the same pinned Guix
      # toolchain: their ELF interpreter/RPATH embeds Guix store paths.
      - name: Cache Rust build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: rust-target-v3-${{ runner.os }}-${{ hashFiles('guix/ci-channels.scm') }}-${{ hashFiles('Cargo.lock', 'manifest-check.scm') }}
          restore-keys: |
            rust-target-v3-${{ runner.os }}-${{ hashFiles('guix/ci-channels.scm') }}-

      - name: Install verified Guix bootstrap
        run: scripts/ci-bootstrap-guix

      - name: Select pinned Guix revision
        run: |
          profile=$(guix time-machine -C guix/ci-channels.scm)
          echo "$profile/bin" >> "$GITHUB_PATH"

      - name: Run CI entry point
        run: scripts/ci --ci-rust

  check-scheme:
    runs-on: ubuntu-24.04
    env:
      NODE_OPTIONS: --use-openssl-ca
    steps:
      - name: Exclude compromised certificate chains
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, re, ssl
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'minde-trust'
          root.mkdir(mode=0o700)
          (root / 'empty').mkdir()
          blocked = {
              # emSign ECC Root CA - G3, plus AAA Certificate Services
              # (cross-signed the same compromised eMudhra intermediates).
              '86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b',
              'd7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4',
          }
          source = pathlib.Path('/etc/ssl/certs/ca-certificates.crt').read_text()
          certs = re.findall(r'-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----', source, re.S)
          certs = [c for c in certs if hashlib.sha256(ssl.PEM_cert_to_DER_cert(c)).hexdigest() not in blocked]
          assert len(certs) > 50, 'unexpected/empty CA bundle'
          bundle = root / 'ca-certificates.crt'
          bundle.write_text('\n'.join(certs) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              for key in ('MINDE_CA_BUNDLE', 'SSL_CERT_FILE', 'CURL_CA_BUNDLE', 'GIT_SSL_CAINFO', 'CARGO_HTTP_CAINFO', 'REQUESTS_CA_BUNDLE'):
                  env.write(f'{key}={bundle}\n')
              env.write(f'SSL_CERT_DIR={root / "empty"}\n')
          print(f'TLS trust: {len(certs)} certificates; compromised trust paths excluded')
          PY

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false

      - name: Install verified Guix bootstrap
        run: scripts/ci-bootstrap-guix

      - name: Select pinned Guix revision
        run: |
          profile=$(guix time-machine -C guix/ci-channels.scm)
          echo "$profile/bin" >> "$GITHUB_PATH"

      - name: Run CI entry point
        run: scripts/ci --ci-scheme

  release-artifacts:
    # Only version tags publish artifacts; the gates themselves already ran in
    # the check-rust/check-scheme jobs via the same scripts/ci entry point.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check-rust, check-scheme]
    runs-on: ubuntu-24.04
    env:
      NODE_OPTIONS: --use-openssl-ca
    permissions:
      contents: write
    steps:
      - name: Exclude compromised certificate chains
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, re, ssl
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'minde-trust'
          root.mkdir(mode=0o700)
          (root / 'empty').mkdir()
          blocked = {
              # emSign ECC Root CA - G3, plus AAA Certificate Services
              # (cross-signed the same compromised eMudhra intermediates).
              '86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b',
              'd7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4',
          }
          source = pathlib.Path('/etc/ssl/certs/ca-certificates.crt').read_text()
          certs = re.findall(r'-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----', source, re.S)
          certs = [c for c in certs if hashlib.sha256(ssl.PEM_cert_to_DER_cert(c)).hexdigest() not in blocked]
          assert len(certs) > 50, 'unexpected/empty CA bundle'
          bundle = root / 'ca-certificates.crt'
          bundle.write_text('\n'.join(certs) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              for key in ('MINDE_CA_BUNDLE', 'SSL_CERT_FILE', 'CURL_CA_BUNDLE', 'GIT_SSL_CAINFO', 'CARGO_HTTP_CAINFO', 'REQUESTS_CA_BUNDLE'):
                  env.write(f'{key}={bundle}\n')
              env.write(f'SSL_CERT_DIR={root / "empty"}\n')
          print(f'TLS trust: {len(certs)} certificates; compromised trust paths excluded')
          PY

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Cache Rust build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: rust-target-v3-${{ runner.os }}-${{ hashFiles('guix/ci-channels.scm') }}-${{ hashFiles('Cargo.lock', 'manifest-check.scm') }}
          restore-keys: |
            rust-target-v3-${{ runner.os }}-${{ hashFiles('guix/ci-channels.scm') }}-

      - name: Install verified Guix bootstrap
        run: scripts/ci-bootstrap-guix

      - name: Select pinned Guix revision
        run: |
          profile=$(guix time-machine -C guix/ci-channels.scm)
          echo "$profile/bin" >> "$GITHUB_PATH"

      - name: Build release artifacts
        run: scripts/ci --release-artifacts

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/ci/artifacts/minde-*.tar.gz build/ci/artifacts/SHA256SUMS \
            --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "Source archives for $GITHUB_SHA."
