# SPDX-License-Identifier: GPL-3.0-or-later
#
# Hosted CI. This workflow contains no gate logic: every check lives in
# scripts/ci, the same noninteractive entry point a developer runs locally
# (`scripts/ci`, `scripts/ci --ci-rust`, `scripts/ci --ci-scheme`). YAML here
# only checks out the code, installs Guix, caches Rust build artifacts,
# calls scripts/ci, and uploads artifacts. If a hosted run and a local run
# disagree, that is a bug in scripts/ci, not here.
#
# check-rust and check-scheme are scripts/ci --ci-rust / --ci-scheme (see its
# header comment) run as two parallel jobs instead of one serial `scripts/ci`:
# together they cover exactly the same gates, but check-rust's environment
# (manifest-check.scm: the Rust toolchain and Smithay's native deps) and
# check-scheme's (manifest-scheme.scm: just Guile and text-processing tools)
# no longer block on each other's Guix install, and check-scheme's usually-
# faster, more-actionable failures (Scheme suites, static analysis, doc
# drift) surface without waiting on `cargo check` to finish compiling
# Smithay.
#
# `pullAfterInstall: false` on every Install Guix step: measured directly
# (job logs), `guix pull` -- rebuilding Guix's entire channel from
# git.guix.gnu.org -- costs ~25 of every ~30 minute run, dwarfing
# everything else in this file combined; the actual gate afterward takes
# minutes. It's skipped in favor of whatever's in the nightly guix-binary
# tarball guix-install-action downloads first anyway (also built from the
# same channel, just without a redundant local rebuild). There is no
# `/gnu/store` cache here: it was tried and confirmed non-functional --
# `/var/guix/substitute/cache/*` is owned by the Guix daemon/build users,
# unreadable by the unprivileged runner account actions/cache saves as
# ("Cannot open: Permission denied" on every save, so it always missed on
# restore too), pure overhead for zero benefit.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      # `cargo check` compiles the full dependency graph (Smithay and its
      # transitive deps) from network-fetched sources -- not the vendored
      # crate mirror, which is only materialized for --release-artifacts.
      # Without this, every run recompiles all of it from scratch.
      #
      # The "v2" prefix: switching to pullAfterInstall: false changed which
      # gcc-toolchain build (and so which /gnu/store path its libgcc_s.so.1
      # lives at) this environment resolves to. A "v1" target/ cache held
      # build-script binaries (x11-dl's, libudev-sys's) RPATH-linked against
      # the old build's now-nonexistent store path -- "cannot open shared
      # object file" at build-script *run* time, not link time, so it only
      # ever affected a cache hit, not a cold build. Bumping the key
      # abandons those stale binaries; scripts/ci also now sets
      # LD_LIBRARY_PATH as defense in depth against the same class of gap
      # recurring silently.
      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: rust-target-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'manifest-check.scm') }}
          restore-keys: |
            rust-target-v2-${{ runner.os }}-

      - name: Install Guix
        uses: PromyLOPh/guix-install-action@v1
        with:
          pullAfterInstall: false

      - name: Run CI entry point
        run: scripts/ci --ci-rust

  check-scheme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Guix
        uses: PromyLOPh/guix-install-action@v1
        with:
          pullAfterInstall: false

      - name: Run CI entry point
        run: scripts/ci --ci-scheme

  release-artifacts:
    # Only version tags publish artifacts; the gates themselves already ran in
    # the check-rust/check-scheme jobs via the same scripts/ci entry point.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check-rust, check-scheme]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: rust-target-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'manifest-check.scm') }}
          restore-keys: |
            rust-target-v2-${{ runner.os }}-

      - name: Install Guix
        uses: PromyLOPh/guix-install-action@v1
        with:
          pullAfterInstall: false

      - name: Build release artifacts
        run: scripts/ci --release-artifacts

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/ci/artifacts/minde-*.tar.gz
            build/ci/artifacts/SHA256SUMS
