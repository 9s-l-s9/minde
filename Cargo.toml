[package]
name = "minde"
version = "0.1.0"
edition = "2024"
description = "StumpWM-inspired Guile Scheme Wayland compositor, built on Smithay"
license = "MIT"

[[bin]]
name = "minde"
path = "src/main.rs"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bitflags = "2.2"
thiserror = "1"
fontdue = "0.9"

[dependencies.smithay]
git = "https://github.com/Smithay/Smithay"
rev = "3021f619e2ae4dab8bfb1e21f3f210923b9b6582"
default-features = false
features = [
    "backend_winit",
    "wayland_frontend",
    "desktop",
    # standalone DRM/udev/libinput backend (src/udev.rs)
    "backend_udev",
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_egl",
    "use_system_lib",
    "renderer_gl",
    "renderer_multi",
    # embedded Xwayland server + X11 window management (src/handlers/xwayland.rs)
    "xwayland",
    "x11rb_event_source",
]

# Only for DrmScanner (connector hotplug bookkeeping); the display-info
# feature (EDID names via libdisplay-info) is off to avoid the extra C
# library dependency.
[dependencies.smithay-drm-extras]
git = "https://github.com/Smithay/Smithay"
rev = "3021f619e2ae4dab8bfb1e21f3f210923b9b6582"
default-features = false

[build-dependencies]
pkg-config = "0.3"
