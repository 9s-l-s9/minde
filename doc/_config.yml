#
# Jekyll config for the GitHub Pages build (.github/workflows/pages.yml).
# doc/ is the Jekyll source root, so paths below are relative to doc/.

title: Minde
description: >-
  Documentation for Minde, a Wayland compositor with an embedded Guile
  policy layer.
theme: jekyll-theme-minimal

plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings

relative_links:
  enabled: true
  collections: false

optional_front_matter:
  remove_originals: true

titles_from_headings:
  enabled: true

# Generated build products and raw data files: served as static assets, not
# run through the Markdown/Liquid pipeline.
include:
  - generated

exclude:
  - Gemfile
  - Gemfile.lock
  - generated/demo-manifest.json
  - generated/api-catalog.scm

# Never hand-edit doc/generated/* -- see scripts/generate-docs. Jekyll only
# copies these files through; it does not regenerate them.
